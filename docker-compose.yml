services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ewaste}
      POSTGRES_USER: ${DB_USER:-ewaste}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      # Padrão: somente nesta máquina. Para compartilhar, configure DB_BIND_IP
      # com o IPv4 da máquina anfitriã na rede confiável.
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
