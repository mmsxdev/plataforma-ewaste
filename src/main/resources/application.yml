spring:
  application:
    name: plataforma-ewaste
  # Lê o arquivo .env da raiz do projeto, se existir (mesmo arquivo usado pelo docker compose)
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ewaste}
    username: ${DB_USER:ewaste}
    password: ${DB_PASSWORD:ewaste}
  jpa:
    hibernate:
      ddl-auto: validate   # o esquema vem só das migrações Flyway
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  storage:
    dir: ${STORAGE_DIR:./uploads}
